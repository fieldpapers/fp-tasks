# Tool configuration only. Dependencies are Debian packages (see Dockerfile).

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "decoder"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# TODO: convert to f-strings (some build the page URL encoded in QR codes, so
# this needs the round-trip render tests first)
"decoder/*" = ["UP031"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

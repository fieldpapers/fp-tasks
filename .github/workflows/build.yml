name: Build

# Validate the image build on pull requests. Publishing the image on
# main/tags is handled by ghcr.yml, so this does not run on push to avoid
# building the (heavy) image twice.
on:
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag fp-tasks:$(date +%s)
